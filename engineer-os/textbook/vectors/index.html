row, it still offers O(1) index access, and it manages memory for you.\\n\\nUnderstanding vector is non-negotiable for C++ interviews.\",\"realWorldProblem\":\"You read an unknown number of integers from input. A fixed array size is painful. `vector` grows as you `push_back`. But if you ignore `reserve`, a large ingest may reallocate multiple times — still amortized O(1) per push, yet with real constant-factor cost and iterator invalidation subtleties.\",\"whyExists\":\"Vectors appear in nearly every C++ solution. Interviewers may ask what `push_back` costs, what `capacity` vs `size` means, and when references invalidate.\",\"historicalBackground\":\"Dynamic arrays predate STL. The C++ Standard Template Library standardized `vector` with complexity guarantees: `push_back` is amortized constant time. Growth strategies typically double capacity to achieve that amortization.\",\"visualIntuition\":\"size = number of live elements  \\ncapacity = allocated slots  \\n\\nExample:\\nsize=3, capacity=4: [10, 20, 30, _]  \\npush_back(40): [10, 20, 30, 40] size=4 capacity=4  \\npush_back(50): allocate capacity=8, move elements, then append → size=5 capacity=8  \\n\\nDoubling means total copy cost across n pushes is ~O(n), so per push amortized O(1).\",\"animationType\":\"vectors\",\"simpleExplanation\":\"**Critical vector APIs:**\\n\\n- `size()` / `capacity()` / `empty()`  \\n- `push_back` / `pop_back`  \\n- `operator[]` / `at` (bounds-checked)  \\n- `insert` / `erase` (O(n) — shifts)  \\n- `reserve(n)` — preallocate capacity  \\n- `resize(n)` — change size (may construct defaults)  \\n- `clear()` — size 0; capacity may remain  \\n\\n**Complexity:**\\n- Random access: O(1)  \\n- push_back: amortized O(1), worst O(n) when growing  \\n- insert/erase middle: O(n)\",\"realLifeAnalogy\":\"A resizable photo album. Pages are capacity. Photos are size. When full, you buy a bigger album (often double) and move photos over. Moving is costly, but rare if you double.\",\"stepByStep\":[\"Prefer vector over raw new[]/delete[] for sequences.\",\"Use reserve when you know approximate final size.\",\"Never hold pointers/references across unchecked reallocation.\",\"Erase carefully; consider erase-remove idiom for value removal.\",\"Pass vector\u003cint\u003e\u0026 to avoid copies; use const\u0026 when read-only.\",\"Know when to use array/string vs vector for interviews.\"],\"dryRun\":{\"input\":\"Empty vector, push 1,2,3,4,5 with doubling growth from 1\",\"steps\":[\"push 1: cap 1 size 1\",\"push 2: grow to 2, move, size 2\",\"push 3: grow to 4, size 3\",\"push 4: size 4 cap 4\",\"push 5: grow to 8, size 5\"],\"output\":\"Few grows; total move cost linear in n\"},\"code\":[{\"language\":\"cpp\",\"title\":\"size vs capacity + reserve\",\"content\":\"#include \u003cbits/stdc++.h\u003e\\nusing namespace std;\\n\\nint main() {\\n    vector\u003cint\u003e v;\\n    v.reserve(8); // capacity at least 8, size still 0\\n    for (int i = 0; i \u003c 5; i++) v.push_back(i * 10);\\n    cout \u003c\u003c \\\"size=\\\" \u003c\u003c v.size() \u003c\u003c \\\" cap=\\\" \u003c\u003c v.capacity() \u003c\u003c \\\"\\\\n\\\";\\n    v.erase(v.begin() + 2); // remove element at index 2 (shifts)\\n    for (int x : v) cout \u003c\u003c x \u003c\u003c \\\" \\\";\\n}\",\"explanation\":\"reserve avoids early reallocations; erase shifts tail elements.\"},{\"language\":\"cpp\",\"title\":\"Erase-remove idiom\",\"content\":\"// Remove all 3s efficiently\\nvoid removeValue(vector\u003cint\u003e\u0026 v, int val) {\\n    v.erase(remove(v.begin(), v.end(), val), v.end());\\n}\",\"explanation\":\"remove shifts kept elements forward; erase shrinks size once.\"}],\"mermaidDiagrams\":[{\"title\":\"Vector Growth\",\"code\":\"flowchart TD\\n  A[push_back x] --\u003e B{size less than capacity?}\\n  B --\u003e|Yes| C[Write at v size]\\n  C --\u003e D[size plus 1]\\n  B --\u003e|No| E[Allocate larger capacity]\\n  E --\u003e F[Move or copy old elements]\\n  F --\u003e G[Deallocate old buffer]\\n  G --\u003e C\"}],\"flowchartSteps\":[{\"id\":\"1\",\"label\":\"push_back\",\"type\":\"start\"},{\"id\":\"2\",\"label\":\"Capacity full?\",\"type\":\"decision\"},{\"id\":\"3\",\"label\":\"Grow buffer\",\"type\":\"process\"},{\"id\":\"4\",\"label\":\"Place element\",\"type\":\"process\"},{\"id\":\"5\",\"label\":\"size++\",\"type\":\"end\"}],\"memoryDiagram\":\"Before grow: capacity=4 size=4\\n[ a | b | c | d ]\\n\\nAfter push e with double:\\nNew capacity=8 size=5\\n[ a | b | c | d | e | _ | _ | _ ]\\nOld buffer freed.\",\"complexityAnalysis\":{\"time\":\"Access O(1); push_back amortized O(1); insert O(n)\",\"space\":\"O(capacity) which is Θ(size) typically within factor 2\",\"best\":\"push_back with spare capacity O(1) worst-case that call\",\"average\":\"amortized O(1) push_back with geometric growth\",\"worst\":\"single push_back causing grow O(n); insert at begin O(n)\",\"explanation\":\"Amortization averages costly grows across many cheap pushes.\"},\"interviewPerspective\":\"You may be asked: “Why not always insert at front in vector?” Answer: O(n) per insert. For deque-like patterns, discuss `deque` or reverse thinking with `push_back`.\",\"commonMistakes\":[{\"mistake\":\"Using push_back in a loop without reserve for known size\",\"fix\":\"reserve(n) when n known — fewer allocations.\"},{\"mistake\":\"Storing reference to v[i] then push_back more elements\",\"fix\":\"Reallocation invalidates references; refetch or use indices.\"},{\"mistake\":\"Confusing resize with reserve\",\"fix\":\"reserve changes capacity only; resize changes size and elements.\"}],\"miniQuiz\":[{\"id\":\"c09-q1\",\"type\":\"mcq\",\"question\":\"Amortized time of push_back on vector is:\",\"options\":[\"O(n)\",\"O(1)\",\"O(log n)\",\"O(n²)\"],\"answer\":1,\"explanation\":\"Geometric growth → amortized O(1).\"},{\"id\":\"c09-q2\",\"type\":\"mcq\",\"question\":\"capacity() vs size():\",\"options\":[\"They are always equal\",\"capacity is allocated storage; size is live elements\",\"size is always greater than capacity\",\"capacity counts only uninitialized memory on stack\"],\"answer\":1,\"explanation\":\"capacity ≥ size always for vector.\"},{\"id\":\"c09-q3\",\"type\":\"truefalse\",\"question\":\"v.reserve(100) sets size to 100.\",\"answer\":false,\"explanation\":\"reserve affects capacity, not size.\"}],\"summary\":[\"vector is a dynamic contiguous array.\",\"size vs capacity is essential.\",\"push_back amortized O(1) via growth (often doubling).\",\"Mid insert/erase still O(n).\",\"reserve when you know size; mind invalidation.\"],\"revisionNotes\":[\"amortized push_back\",\"reserve ≠ resize\",\"erase shifts\",\"invalidation on reallocate\"],\"practiceProblems\":[{\"id\":\"c09-p1\",\"title\":\"Running Capacity Trace\",\"difficulty\":\"Easy\",\"statement\":\"Starting from empty vector, push_back 1..10. Assume capacity starts 0 and doubles when full (1,2,4,8,16...). List size and capacity after each push.\",\"observation\":\"You will see grows at 1,2,4,8.\",\"thinkingQuestions\":[\"How many element moves total roughly?\"],\"hints\":[\"Simulate on paper.\"],\"bruteForce\":\"Run code with capacity prints\",\"optimization\":\"Mental model of doubling\",\"dryRun\":\"After 5 pushes: size 5 cap 8 in this model\",\"complexity\":\"Total construction moves O(n)\",\"reflection\":\"When would reserve(10) help?\",\"solution\":\"Grows when size would exceed capacity; exact sequence depends on implementation, but doubling model is the interview standard explanation.\",\"language\":\"cpp\"},{\"id\":\"c09-p2\",\"title\":\"Insert Interval-style Building\",\"difficulty\":\"Medium\",\"statement\":\"Build a vector of first n squares using reserve(n) and push_back. Then erase the element at index n/2 if n\u003e0. State complexities.\",\"observation\":\"Mix of growth API and erase shifting.\",\"thinkingQuestions\":[\"What is complexity of that erase?\"],\"hints\":[\"reserve then loop push_back.\"],\"bruteForce\":\"No reserve\",\"optimization\":\"reserve(n)\",\"dryRun\":
