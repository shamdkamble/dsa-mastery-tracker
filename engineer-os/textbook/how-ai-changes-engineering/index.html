s can autocomplete functions, explain errors, and draft boilerplate in seconds. That is real leverage.\\n\\nThey can also destroy interview preparation if you use them to skip struggle — because **struggle is the training**.\",\"realWorldProblem\":\"You paste a LeetCode problem into a chatbot, get a perfect solution, read it once, and mark it “done.” A week later in a mock interview, you cannot reconstruct the idea. The model remembers. You do not.\",\"whyExists\":\"Week 1 must set an AI policy for EngineerOS:\\n\\n- Allowed: explaining a concept you already attempted, generating extra examples, reviewing your code after you wrote it  \\n- Forbidden during training: asking for full solutions before your own brute force + optimized attempt  \\n- Interview reality: you will not have unconstrained AI in a timed coding round  \\n\\nThis chapter defines that policy clearly.\",\"historicalBackground\":\"Software engineering has always absorbed automation: compilers, IDEs, linters, Stack Overflow, and now LLMs. Each wave increased speed and raised the bar for taste, verification, and system thinking.\\n\\nThe engineers who win are not those who refuse tools, nor those who blindly trust them — but those who **own outcomes**.\",\"visualIntuition\":\"Training mode vs Delivery mode:\\n\\n- **Training (EngineerOS):** weights on; AI spotter only after you try  \\n- **Delivery (job):** use AI heavily, but you still review complexity, security, and correctness  \\n\\nDo not train in delivery mode. Your muscles will not grow.\",\"animationType\":\"none\",\"simpleExplanation\":\"AI changes the **speed of producing code**, not the need for:\\n\\n- Problem decomposition  \\n- Complexity judgment  \\n- Edge-case paranoia  \\n- Responsibility for failures  \\n\\nFor interviews, companies know AI exists. They still need humans who can think when the tool is wrong, incomplete, or unavailable.\",\"realLifeAnalogy\":\"GPS made paper maps rare — but if GPS dies in a remote area, the driver who understands navigation still gets home. AI is GPS for code. Fundamentals are navigation.\",\"stepByStep\":[\"Attempt problem for at least 15–20 minutes before any AI help.\",\"When using AI, ask for hints, not full solutions first.\",\"Re-implement any AI-shown idea from scratch without looking.\",\"Ask AI to critique your complexity analysis after you write it.\",\"Never log a problem as solved unless you can re-explain it cold.\"],\"dryRun\":{\"input\":\"Stuck on binary search boundary condition\",\"steps\":[\"Write failing mental model\",\"Ask AI: 'What are common off-by-one patterns in binary search?' not 'solve this'\",\"Apply insight to your code\",\"Re-derive on paper next day\"],\"output\":\"AI used as tutor, not answer key\"},\"code\":[{\"language\":\"cpp\",\"title\":\"Ownership checklist after AI suggestion\",\"content\":\"// Before accepting any generated solution, verify:\\n// 1) Invariants\\n// 2) Edge cases\\n// 3) Time/space\\n// 4) You can rewrite from memory in 15 minutes\\nbool ownedSolution = canRewriteFromMemory \u0026\u0026 complexityUnderstood;\",\"explanation\":\"If you cannot rewrite it, you do not own it.\"}],\"mermaidDiagrams\":[{\"title\":\"AI Policy for Interview Prep\",\"code\":\"flowchart TD\\n  A[See Problem] --\u003e B[Own Attempt]\\n  B --\u003e C{Solved?}\\n  C --\u003e|Yes| D[Write reflection + complexity]\\n  C --\u003e|No after effort| E[Hint-level help]\\n  E --\u003e F[Retry]\\n  F --\u003e G{Still stuck?}\\n  G --\u003e|Yes| H[Read solution]\\n  H --\u003e I[Re-implement cold later]\\n  G --\u003e|No| D\\n  I --\u003e D\"}],\"flowchartSteps\":[{\"id\":\"1\",\"label\":\"Attempt Alone\",\"type\":\"start\"},{\"id\":\"2\",\"label\":\"Need Help?\",\"type\":\"decision\"},{\"id\":\"3\",\"label\":\"Hint Only\",\"type\":\"process\"},{\"id\":\"4\",\"label\":\"Full Solution Last\",\"type\":\"process\"},{\"id\":\"5\",\"label\":\"Re-own by Rewrite\",\"type\":\"end\"}],\"complexityAnalysis\":{\"time\":\"AI can reduce typing time drastically\",\"space\":\"Your long-term memory still limited — train it\",\"best\":\"AI + strong fundamentals\",\"average\":\"AI for boilerplate, human for design\",\"worst\":\"AI-only prep → interview collapse\",\"explanation\":\"Optimize for retained skill, not short-term answer acquisition.\"},\"interviewPerspective\":\"Some companies experiment with AI-assisted interviews; many still run classic rounds. Prepare for the classic round. If AI is allowed later, your fundamentals make you faster and safer with it.\",\"commonMistakes\":[{\"mistake\":\"Paste-problem → paste-solution loop\",\"fix\":\"Enforce attempt timer before any reveal.\"},{\"mistake\":\"Assuming generated code is correct\",\"fix\":\"Trace examples; test edges; check complexity.\"},{\"mistake\":\"Using AI during timed mocks\",\"fix\":\"Mocks must match real constraints.\"}],\"miniQuiz\":[{\"id\":\"c04-q1\",\"type\":\"mcq\",\"question\":\"Best first use of AI when stuck on a practice problem?\",\"options\":[\"Ask for the full optimal code immediately\",\"Ask for a hint or conceptual question after a real attempt\",\"Ask it to take the interview for you\",\"Ignore fundamentals forever\"],\"answer\":1,\"explanation\":\"Hints preserve training stimulus; full answers early destroy it.\"}],\"summary\":[\"AI is leverage in delivery, risky as a crutch in training.\",\"Own solutions by rewriting and explaining.\",\"EngineerOS AI mentor is limited to Week 1 on purpose.\"],\"revisionNotes\":[\"Attempt → hint → solution → rewrite\",\"No ownership = not solved\",\"Train without AI; deliver with judgment\"],\"practiceProblems\":[{\"id\":\"c04-p1\",\"title\":\"AI-Free Timer Drill\",\"difficulty\":\"Easy\",\"statement\":\"Solve one Easy array problem in 25 minutes with AI completely off. Afterward, optionally ask AI to review your code quality only.\",\"observation\":\"Timer + constraints recreate interview friction.\",\"thinkingQuestions\":[\"Where did you want to peek?\",\"What did struggle teach you?\"],\"hints\":[\"Pick a problem you haven't solved this month.\"],\"bruteForce\":\"Whatever you can justify first\",\"optimization\":\"Only after brute force is clear\",\"dryRun\":\"Use 2 examples minimum\",\"complexity\":\"State it aloud\",\"reflection\":\"Did you earn the solution?\",\"solution\":\"Process \u003e answer. If unsolved, read editorial, then re-solve after 24 hours cold.\",\"language\":\"cpp\"}],\"reflectionQuestions\":[\"How have you used AI in learning so far — tutor or crutch?\",\"What personal AI rule will you follow in August?\",\"Where can AI legitimately speed up your non-interview engineering work?\"]}}],\"$L15\"]}]\n"])</script><script>self.__next_f.push([1,"16:I[57448,[\"/engineer-os/_next/static/chunks/1o99rpt26lk1m.js\",\"/engineer-os/_next/static/chunks/1-8s9_t85wwr4.js\",\"/engineer-os/_next/static/chunks/1uzvrh9n_8h75.js\",\"/engineer-os/_next/static/chunks/25xkfa-eke-9-.js\",\"/engineer-os/_next/static/chunks/063i7i55yx_a8.js\",\"/engineer-os/_next/static/chunks/11bjjpn8r7w0g.js\",\"/engineer-os/_next/static/chunks/248x-pjib9jxv.js\"],\"ChapterNav\"]\n15:[\"$\",\"$L16\",null,{\"prev\":{\"slug\":\"why-dsa-still-matters\",\"title\":\"Why DSA Still Matters\"},\"next\":{\"slug\":\"growth-mindset\",\"title\":\"Growth Mindset\"}}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#6366f1\"}]]\n"])</script><script>self.__next_f.push([1,"17:I[27201,[\"/engineer-os/_next/static/chunks/1o99rpt26lk1m.js\",\"/engineer-os/_next/static/chunks/1-8s9_t85wwr4.js\",\"/engineer-os/_next/static/chunks/1uzvrh9n_8h75.js\"],\"IconMark\"]\nb:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"How AI Changes Engineering · EngineerOS Textbook\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Use AI as leverage — never as a substitute for thinking\"}
