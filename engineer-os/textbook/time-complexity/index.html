orithm get?**\\n\\nIt is not about the exact milliseconds on your laptop. It is about **growth rate** — the shape of cost as n → large.\",\"realWorldProblem\":\"A feature works on a demo dataset of 100 rows. You ship it. Production has 2,000,000 rows. The request handler now takes 40 seconds. Users leave. The algorithm never “became wrong” — it became **too expensive as n grew**.\",\"whyExists\":\"Without time complexity, you cannot compare approaches or know whether an idea can pass interview constraints (often n up to 10⁵ or 10⁶). This chapter builds gut feel before formal Big-O notation deep dive.\",\"historicalBackground\":\"Algorithm analysis matured through the 20th century as machines ran larger problems. Donald Knuth and others formalized techniques to count operations independent of a particular CPU. Interviews inherited this language because it is portable across hardware and languages.\",\"visualIntuition\":\"Imagine four stopwatches timing the same task at n=10, 100, 1000, 100000:\\n\\n- Constant work: stopwatch barely moves  \\n- Linear: moves proportional to n  \\n- Quadratic: explodes  \\n- Logarithmic: barely notices huge n  \\n\\nIn the Visual Playground, you will animate linear search vs binary search across these sizes.\",\"animationType\":\"complexity\",\"simpleExplanation\":\"**Count dominant operations** as a function of input size n.\\n\\nExamples:\\n- One loop from 1..n → roughly c·n operations → linear  \\n- Nested loops i=1..n, j=1..n → roughly c·n² → quadratic  \\n- Halving search space each step → ~log₂(n) → logarithmic  \\n\\nIgnore machine-specific constants in high-level comparison. Focus on how the formula behaves when n multiplies by 10.\",\"realLifeAnalogy\":\"Finding a name in an unsorted guest list of n people: you may check each name (linear). Finding a word in a dictionary using alphabetical order: you jump midpoints (logarithmic). Same “find item” goal; different growth.\",\"stepByStep\":[\"Identify the input size parameter n (and maybe m).\",\"Find the code path that runs most as n grows.\",\"Count loops, recursions, and repeated work.\",\"Drop lower-order terms and constant factors for comparison.\",\"Sanity-check: if n doubles, does time ~double? quadruple? barely change?\",\"State best/average/worst when they differ.\"],\"dryRun\":{\"input\":\"Linear search for x in array of size n\",\"steps\":[\"Check index 0,1,2,... until found or end\",\"Worst case: x absent or at end → n comparisons\",\"Best case: x at index 0 → 1 comparison\",\"Average (random): ~n/2 comparisons\"],\"output\":\"Worst-case linear time in n\"},\"code\":[{\"language\":\"cpp\",\"title\":\"Counting operations mentally\",\"content\":\"int linearSearch(const vector\u003cint\u003e\u0026 a, int x) {\\n    for (int i = 0; i \u003c (int)a.size(); i++) { // up to n iterations\\n        if (a[i] == x) return i;              // O(1) work each\\n    }\\n    return -1;\\n}\\n// Worst-case time: O(n)\",\"explanation\":\"Loop bound depends on n; body is constant work → O(n).\"},{\"language\":\"cpp\",\"title\":\"Quadratic pattern\",\"content\":\"bool hasDuplicateNested(const vector\u003cint\u003e\u0026 a) {\\n    int n = (int)a.size();\\n    for (int i = 0; i \u003c n; i++)\\n        for (int j = i + 1; j \u003c n; j++)\\n            if (a[i] == a[j]) return true;\\n    return false;\\n}\\n// Worst-case time: O(n²)\",\"explanation\":\"Nested loops over n produce quadratic growth.\"}],\"mermaidDiagrams\":[{\"title\":\"Growth Comparison\",\"code\":\"flowchart LR\\n  A[n grows] --\u003e B[O1 flat]\\n  A --\u003e C[Ologn slow]\\n  A --\u003e D[On linear]\\n  A --\u003e E[Onlogn]\\n  A --\u003e F[On2 steep]\\n  F --\u003e G[Often too slow at 1e5+]\"}],\"flowchartSteps\":[{\"id\":\"1\",\"label\":\"Identify n\",\"type\":\"start\"},{\"id\":\"2\",\"label\":\"Find hot loops\",\"type\":\"process\"},{\"id\":\"3\",\"label\":\"Estimate growth\",\"type\":\"process\"},{\"id\":\"4\",\"label\":\"Check constraints\",\"type\":\"decision\"},{\"id\":\"5\",\"label\":\"Accept or redesign\",\"type\":\"end\"}],\"memoryDiagram\":\"CPU does not \\\"feel\\\" Big-O — it executes instructions.\\nAnalysis abstracts instruction counts into growth classes\\nso humans can compare algorithms before coding all of them.\",\"complexityAnalysis\":{\"time\":\"The subject of this chapter\",\"space\":\"Related but separate (extra memory growth)\",\"best\":\"Minimum work over inputs of size n\",\"average\":\"Expected work under an input distribution\",\"worst\":\"Maximum work — interview default unless stated\",\"explanation\":\"Interviews usually want worst-case unless average is specified (e.g., hash tables).\"},\"interviewPerspective\":\"After coding, say: “Time complexity is O(n) because we scan once; space is O(1) extra.” If you optimized from O(n²) to O(n), narrate that journey — it scores points.\",\"commonMistakes\":[{\"mistake\":\"Confusing O(n) with 'fast on my machine'\",\"fix\":\"Always relate to constraints (n ≤ ?).\"},{\"mistake\":\"Counting only loops and missing expensive callees\",\"fix\":\"If you call a O(n) function inside a O(n) loop, think O(n²).\"},{\"mistake\":\"Saying O(n/2) as final class\",\"fix\":\"O(n/2) is O(n). Drop constant factors.\"}],\"miniQuiz\":[{\"id\":\"c06-q1\",\"type\":\"complexity\",\"question\":\"for i in 1..n: for j in 1..n: O(1) work. Time complexity?\",\"options\":[\"O(n)\",\"O(n log n)\",\"O(n²)\",\"O(2ⁿ)\"],\"answer\":2,\"explanation\":\"n·n constant work = O(n²).\"},{\"id\":\"c06-q2\",\"type\":\"mcq\",\"question\":\"If n doubles and runtime roughly doubles, the algorithm is likely:\",\"options\":[\"O(1)\",\"O(log n)\",\"O(n)\",\"O(n²)\"],\"answer\":2,\"explanation\":\"Linear growth tracks n proportionally.\"},{\"id\":\"c06-q3\",\"type\":\"predict\",\"question\":\"Roughly how many steps does binary search need for n=1,000,000 (power of two-ish)?\",\"options\":[\"About 20\",\"About 1,000,000\",\"About 10^12\",\"Exactly 2\"],\"answer\":0,\"explanation\":\"log₂(10^6) ≈ 20.\"}],\"summary\":[\"Time complexity describes growth of running time with input size.\",\"Focus on dominant terms; prefer worst-case in interviews.\",\"Match algorithm class to constraints.\",\"Nested loops and repeated linear scans are common killers.\"],\"revisionNotes\":[\"n=1e5 → avoid O(n²) generally\",\"n=1e8 → need near O(n) or better\",\"Always state time and space\"],\"practiceProblems\":[{\"id\":\"c06-p1\",\"title\":\"Estimate Before Coding\",\"difficulty\":\"Easy\",\"statement\":\"For n ≤ 1e5, which of these are typically acceptable: O(n), O(n log n), O(n²)? Explain with approximate operation counts.\",\"observation\":\"1e5² = 1e10 — too large for typical 1e8 ops/sec rule of thumb.\",\"thinkingQuestions\":[\"What constant factors might still kill O(n log n)?\"],\"hints\":[\"Use 10^8 operations/sec as a rough mental budget.\"],\"bruteForce\":\"O(n²) nested compare\",\"optimization\":\"Sort O(n log n) or hash O(n) depending on problem\",\"dryRun\":\"Compute 1e5² vs 1e5·20\",\"complexity\":\"Selection depends on constraints\",\"reflection\":\"Will you check constraints first in every problem now?\",\"solution\":\"Typically O(n) and O(n log n) OK; O(n²) often not for n=1e5. Always verify problem limits.\",\"language\":\"cpp\"}],\"reflectionQuestions\":[\"Where have you seen a feature slow down as data grew?\",\"How will you estimate complexity before coding tomorrow?\",\"Confidence on time complexity (0–100)?\"]}}],\"$L15\"]}]\n"])</script><script>self.__next_f.push([1,"16:I[49008,[\"/engineer-os/_next/static/chunks/2v0569zfupma8.js\",\"/engineer-os/_next/static/chunks/2s4kcos--bfwu.js\",\"/engineer-os/_next/static/chunks/2zk4ayzvgnc7s.js\",\"/engineer-os/_next/static/chunks/3xjgny7twcw-s.js\",\"/engineer-os/_next/static/chunks/0n6nt2m1t1cub.js\",\"/engineer-os/_next/static/chunks/0-mi6p8j9gt3y.js\",\"/engineer-os/_next/static/chunks/01qgi1dxtbq0_.js\"],\"ChapterNav\"]\n15:[\"$\",\"$L16\",null,{\"prev\":{\"slug\":\"growth-mindset\",\"title\":\"Growth Mindset\"},\"next\":{\"slug\
